services:
  python-api:
    build:
      context: ./python-api
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
    container_name: find-me-job-python-api
    restart: unless-stopped
    environment:
      # GENERIC_TIMEZONE is real configuration — the scheduler is built with it at
      # startup. Everything below it is a first-boot seed for app_settings: once a
      # row exists the table wins and these are ignored, so edit them in the
      # dashboard's Settings tab rather than here.
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      - DELETE_OLD_JOBS_DAYS=${DELETE_OLD_JOBS_DAYS:-}
      - PIPELINE_ENABLED=${PIPELINE_ENABLED:-}
      - PIPELINE_MODE=${PIPELINE_MODE:-}
      - PIPELINE_EVERY_N_HOURS=${PIPELINE_EVERY_N_HOURS:-}
      - PIPELINE_AT_MINUTE=${PIPELINE_AT_MINUTE:-}
      - PIPELINE_AT_TIME=${PIPELINE_AT_TIME:-}
      - RETENTION_AT_TIME=${RETENTION_AT_TIME:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_URL=${LLM_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - FILTERING_SCORE=${FILTERING_SCORE:-}
      - AUTO_EMAIL=${AUTO_EMAIL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ID=${TELEGRAM_ID:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_APP_PASSWORD=${SMTP_APP_PASSWORD:-}
      - SENDER_NAME=${SENDER_NAME:-}
      - SCORING_DELAY_SECONDS=${SCORING_DELAY_SECONDS:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./data/db:/data/db
      # writable: the dashboard Settings tab replaces the CV and edits params
      - ./cv.docx:/data/cv.docx
      - ./params:/data/params
    ports:
      # host port only — the dashboard reaches the API at python-api:8001
      # internally, so change API_PORT freely if 8001 is taken on your machine.
      # Bound to loopback: these endpoints are unauthenticated and include the CV,
      # a full database backup, and SMTP send.
      - "127.0.0.1:${API_PORT:-8001}:8001"

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
    container_name: find-me-job-dashboard
    restart: unless-stopped
    environment:
      # relative timestamps ("12 min ago") are computed against the container clock,
      # and rows carry naive local timestamps written by python-api
      - TZ=${GENERIC_TIMEZONE:-UTC}
      # Nothing else: the cutoff, the sender name and the sender address are read
      # from the API now, so the dashboard cannot disagree with the scorer.
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      python-api:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:2026.3.0
    container_name: find-me-job-tunnel
    restart: unless-stopped
    # Metrics address is set explicitly so python-api can always scrape the
    # quick-tunnel URL from http://cloudflared:20241/metrics.
    command: tunnel --url http://dashboard:8501 --metrics 0.0.0.0:20241
    depends_on:
      dashboard:
        condition: service_healthy
